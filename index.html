<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>살기 좋은 도시 설계소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --navy:#001B49;
  --navy-2:#0B2C63;
  --blue:#1D69C9;
  --blue-d:#14539F;
  --blue-l:#4E8FDC;
  --yellow:#F7BB04;
  --yellow-d:#D9A303;
  --green:#20944A;
  --purple:#664AC4;
  --orange:#EA6F04;
  --teal:#02A1B4;
  --sky:#D8F3FC;
  --paper:#FFFFFF;
  --ground:#EEF3F8;
  --line:#CBD8E6;
  --ink:#10203B;
  --ink-soft:#4C5D77;
  --rail:236px;
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:18px;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;display:block}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[hidden]{display:none !important}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100%;min-height:100%}
.topbar{
  flex:0 0 auto;background:var(--navy);color:#fff;
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--sky)}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-t{font-family:var(--display);font-size:22px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:13px;color:#9EBCE6;white-space:nowrap}
.topbar-spacer{flex:1 1 auto}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--navy-2);color:#fff;padding:10px 14px;font-size:15px;font-weight:700;
  border:1px solid rgba(255,255,255,.18);
}
.tbtn:hover{background:var(--blue-d)}
.tbtn.is-on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.menu-btn{display:none}

.main{flex:1 1 auto;display:flex;min-height:0}

/* rail */
.rail{
  flex:0 0 var(--rail);background:var(--blue);color:#fff;overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.rail-group{border-bottom:1px solid rgba(255,255,255,.16)}
.rail-h{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:15px 16px;font-size:18px;font-weight:700;color:#fff;min-height:58px;
}
.rail-h:hover{background:var(--blue-d)}
.rail-h .chev{flex:0 0 auto;width:14px;height:14px;transition:transform .22s ease}
.rail-h .gcount{margin-left:auto;font-size:13px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 8px;font-variant-numeric:tabular-nums}
.rail-group.open > .rail-h{background:var(--navy)}
.rail-group.open > .rail-h .chev{transform:rotate(90deg)}
.rail-group.has-now > .rail-h{color:var(--yellow)}
.rail-group.has-now > .rail-h .gcount{background:var(--yellow);color:var(--navy)}
.rail-items{padding:4px 0 8px;background:rgba(0,27,73,.22)}
.rail-i{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 16px 11px 30px;font-size:16px;color:#EAF2FC;border-left:4px solid transparent;
}
.rail-i:hover{background:var(--blue-d)}
.rail-i.is-now{background:var(--navy);border-left-color:var(--yellow);font-weight:700;color:#fff}
.rail-i .dot{width:8px;height:8px;background:rgba(255,255,255,.35);flex:0 0 auto}
.rail-i.is-done .dot{background:var(--yellow)}
.scrim{display:none}

/* stage */
.stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--ground)}
.prog{flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:12px}
.prog-bar{flex:1 1 auto;height:12px;background:var(--line);overflow:hidden}
.prog-fill{height:100%;background:var(--green);width:0%;transition:width .3s ease}
.prog-t{font-size:15px;color:var(--ink-soft);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

.scroller{flex:1 1 auto;overflow-y:auto;overflow-x:hidden}
.screen{display:none;padding:22px 16px 28px;max-width:1340px;margin:0 auto}
.screen.is-now{display:block}

.navbar{
  flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
.navbar .spacer{flex:1 1 auto}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 24px;font-weight:700;font-size:19px;min-height:58px;
  background:var(--blue);color:#fff;border:2px solid var(--blue);
}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.ghost{background:var(--paper);color:var(--blue-d);border-color:var(--line)}
.btn.ghost:hover{background:var(--sky);border-color:var(--blue-l)}
.btn.go{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
.btn.go:hover{background:var(--yellow-d);border-color:var(--yellow-d)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:10px 16px;min-height:46px;font-size:16px}

/* ---------- screen header + mascot ---------- */
.eyebrow{display:inline-block;background:var(--navy);color:#fff;font-size:15px;font-weight:700;letter-spacing:.08em;padding:7px 14px;margin-bottom:12px}
.eyebrow.a1{background:var(--green)}
.eyebrow.a2{background:var(--orange)}
.eyebrow.wrap{background:var(--purple)}
h1.title{font-family:var(--display);font-size:clamp(30px,4.2vw,52px);line-height:1.25;margin:0 0 6px;text-wrap:balance;font-weight:400}
p.lede{margin:0 0 20px;color:var(--ink-soft);font-size:clamp(17px,2vw,23px)}

.viva{display:flex;align-items:flex-start;gap:12px;margin:0 0 18px}
.viva-pic{width:72px;height:72px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:3px solid var(--teal);background:var(--sky)}
.viva-pic img{width:100%;height:100%;object-fit:cover}
.viva-say{
  position:relative;background:var(--paper);border:2px solid var(--teal);
  padding:12px 18px;font-size:18px;color:var(--ink);max-width:60ch;
}
.viva-say::before{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(45deg)}

/* ---------- generic blocks ---------- */
.card{background:var(--paper);border:1px solid var(--line);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.hint{font-size:15px;color:var(--ink-soft)}
.sect-h{font-family:var(--display);font-size:24px;margin:0 0 12px;font-weight:400}
.field label{display:block;font-weight:700;font-size:18px;margin-bottom:8px}
textarea,input[type=text]{
  width:100%;background:var(--paper);border:3px solid var(--line);padding:12px 14px;line-height:1.7;font-size:18px;
}
textarea:focus,input[type=text]:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:100px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--line);background:var(--paper);padding:9px 15px;font-size:17px;font-weight:500;min-height:50px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--blue-l);background:var(--sky)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.city.on{background:var(--green);border-color:var(--green)}
.chip.rural.on{background:var(--orange);border-color:var(--orange)}
.chip.del{background:var(--sky);border-color:var(--blue-l);color:var(--navy)}

/* cover */
.cover{display:grid;grid-template-columns:1.02fr .98fr;gap:0;align-items:stretch;background:var(--sky);border:1px solid var(--line);padding:0;overflow:hidden;min-height:clamp(360px,52vh,560px)}
.cover-text{padding:clamp(20px,3vw,44px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.cover h1{font-family:var(--display);font-size:clamp(32px,5.2vw,58px);line-height:1.18;margin:8px 0 12px;font-weight:400}
.cover .book{display:inline-block;background:var(--navy);color:#fff;font-size:16px;font-weight:700;padding:8px 14px}
.cover-stage{position:relative;perspective:1100px;min-height:100%}
.cover-art{background:var(--sky);border:0;border-left:6px solid var(--teal);overflow:hidden;position:relative;cursor:pointer;height:100%;min-height:100%}
.cover-art img{width:100%;height:100%;object-fit:cover;display:block}
.art-tilt{height:100%;transform:rotateY(var(--px,0deg)) rotateX(var(--py,0deg));transition:transform .25s ease-out;transform-style:preserve-3d}
.art-bob{height:100%;animation:bob 5.5s ease-in-out infinite;transform-origin:50% 60%}
@keyframes bob{0%,100%{transform:translateY(7px) rotate(-.5deg) scale(1.07)}50%{transform:translateY(-11px) rotate(.5deg) scale(1.085)}}
.cover-art.pop .art-bob{animation:hop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes hop{0%{transform:translateY(7px) scale(1.07)}35%{transform:translateY(-26px) scale(1.12)}70%{transform:translateY(12px) scale(1.05)}100%{transform:translateY(7px) scale(1.07)}}
.glint{position:absolute;top:-30%;left:-40%;width:28%;height:170%;background:rgba(255,255,255,.28);transform:skewX(-18deg);animation:sweep 6.5s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,72%{left:-40%}88%,100%{left:125%}}
.pin{position:absolute;width:44px;height:56px;pointer-events:none;z-index:2}
.pin.p1{left:14px;top:13%;animation:drift1 6s ease-in-out infinite}
.pin.p2{right:14px;top:30%;animation:drift2 7.4s ease-in-out infinite}
.pin.p3{left:20%;bottom:16px;animation:drift1 8.2s ease-in-out infinite .6s}
.pin.p4{right:24%;top:14px;animation:drift2 6.8s ease-in-out infinite 1.1s}
@keyframes drift1{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-16px) rotate(5deg)}}
@keyframes drift2{0%,100%{transform:translateY(0) rotate(6deg)}50%{transform:translateY(-20px) rotate(-4deg)}}
.viva-hi{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--navy);padding:10px 16px;font-family:var(--display);font-size:16px;white-space:nowrap;z-index:4;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.viva-hi::after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;margin-left:-8px;background:var(--paper);border-right:3px solid var(--navy);border-bottom:3px solid var(--navy);transform:rotate(45deg)}
.art-tip{position:absolute;right:10px;bottom:10px;background:var(--navy);color:#fff;font-size:11px;padding:4px 8px;z-index:2;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .art-bob,.glint,.pin{animation:none !important}
  .glint{display:none}
  .art-tilt{transition:none}
}
.cover-meta{font-size:13px;color:var(--ink-soft);margin-top:14px}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;margin-top:20px}
.goal{padding:16px;color:#fff}
.goal:nth-child(1){background:var(--green)}
.goal:nth-child(2){background:var(--purple)}
.goal:nth-child(3){background:var(--orange)}
.goal:nth-child(4){background:var(--teal)}
.goal b{display:block;font-family:var(--display);font-size:21px;font-weight:400;margin-bottom:5px}
.goal span{font-size:16px;line-height:1.55;opacity:.95}

/* video */
.vid{background:var(--paper);border:1px solid var(--line)}
.vid-h{background:var(--navy);color:#fff;padding:12px 16px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.vid-frame{position:relative;aspect-ratio:16/9;background:#0A1526;max-width:100%}
.vid-frame iframe,.vid-frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0A1526}
.vid-cover{position:absolute;inset:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--navy);color:#fff}
.vid-cover .sky-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:52%}
.cover-txt{position:relative;font-family:var(--display);font-size:clamp(16px,2.2vw,22px);text-align:center;padding:0 16px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.play{position:relative;width:84px;height:84px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;border:5px solid #fff}
.vid-cover:hover .play{background:var(--yellow-d)}
.vid-foot{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)}
.vid-foot .hint{flex:1 1 auto}
.novid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#CBD8E6;text-align:center;padding:20px;font-size:14px}

/* qr */
.qr-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qr-box{background:#fff;border:1px solid var(--line);padding:12px;width:168px;height:168px;display:flex;align-items:center;justify-content:center}
.qr-box canvas,.qr-box img{width:140px;height:140px}

/* choice buttons */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr));gap:12px}
.choices.stack1{grid-template-columns:1fr}
.choices.stack1 .choice{justify-content:flex-start;padding-left:22px;min-height:84px}
.choice{
  border:3px solid var(--line);background:var(--paper);padding:16px 10px;text-align:center;
  font-family:var(--display);font-size:clamp(19px,1.9vw,26px);font-weight:400;min-height:92px;
  display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;
}
.choice:hover{border-color:var(--blue-l);background:var(--sky)}
.choice.on-city{background:var(--green);border-color:var(--green);color:#fff}
.choice.on-rural{background:var(--orange);border-color:var(--orange);color:#fff}
.choice.on-unsure{background:var(--purple);border-color:var(--purple);color:#fff}
.choice .num{width:34px;height:34px;background:var(--navy);color:#fff;font-size:17px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--body);font-weight:700}
.choice.on-city .num,.choice.on-rural .num,.choice.on-unsure .num{background:rgba(255,255,255,.28)}

/* puzzle */
.puz-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.seg{display:flex;border:3px solid var(--line);background:var(--paper)}
.seg button{padding:11px 20px;font-weight:700;font-size:17px;min-height:52px}
.seg button.on{background:var(--navy);color:#fff}
.count{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;background:var(--navy);color:#fff;padding:11px 20px;font-size:19px}
.board{
  position:relative;width:100%;max-width:min(1180px, calc(48vh * 16 / 9));margin:0 auto;aspect-ratio:16/9;
  background:#EAF1F8;border:5px solid var(--navy);overflow:hidden;touch-action:none;
}
.board-hint{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:.14}
.board-grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cell-hl{position:absolute;border:5px solid var(--yellow);background:rgba(247,187,4,.22);pointer-events:none;z-index:40}
.slot{position:absolute;pointer-events:none}
.slot svg{width:100%;height:100%;display:block}
.board.done .board-hint,.board.done .board-grid{opacity:0}
.tray{background:var(--paper);border:3px solid var(--line);padding:14px;margin-top:16px}
.tray-h{font-weight:700;font-size:17px;color:var(--ink-soft);margin-bottom:12px}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.piece{touch-action:none;cursor:grab;position:relative;background:transparent}
.piece svg{width:100%;height:100%;display:block;pointer-events:none}
.piece.sel{outline:5px solid var(--yellow);outline-offset:2px;background:rgba(247,187,4,.2)}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;opacity:.95}
.drag-ghost svg{width:100%;height:100%;display:block}
.done-badge{background:var(--green);color:#fff;font-family:var(--display);font-size:24px;padding:14px 22px;display:inline-flex;align-items:center;gap:10px;margin-top:14px}
/* observe */
.observe{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.zoomwrap{border:3px solid var(--navy);background:#000;overflow:hidden;position:relative}
.zoomwrap img{width:100%;transition:transform .25s ease;transform-origin:center center}
.zoom-ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.zoom-ctl button{width:40px;height:40px;background:var(--navy);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:700}

/* chosung */
.sentence{font-family:var(--display);font-size:clamp(24px,3.4vw,40px);line-height:2.1;font-weight:400}
.cho{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--yellow);color:var(--navy);border:3px solid var(--yellow-d);
  padding:2px 14px;margin:0 2px;font-family:var(--display);min-width:2.6em;
  transition:transform .18s ease;
}
.cho:not(.open){animation:nudge 2.2s ease-in-out infinite}
.cho.open{background:var(--blue);border-color:var(--blue-d);color:#fff;animation:none}
@keyframes nudge{0%,88%,100%{transform:translateY(0)}92%{transform:translateY(-5px)}96%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.cho:not(.open){animation:none}}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.feat{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--teal);padding:16px;display:flex;gap:12px;align-items:flex-start}
.feat:nth-child(1){border-top-color:var(--green)}
.feat:nth-child(2){border-top-color:var(--blue)}
.feat:nth-child(3){border-top-color:var(--orange)}
.feat:nth-child(4){border-top-color:var(--purple)}
.feat:nth-child(5){border-top-color:var(--teal)}
.feat .ico{flex:0 0 auto;width:54px;height:54px;background:var(--sky);display:flex;align-items:center;justify-content:center}
.feat .txt{font-family:var(--display);font-size:24px;line-height:1.8;font-weight:400}
.feat .cho{font-size:16px;padding:1px 10px;border-width:2px}
.mine{background:var(--sky);border-left:6px solid var(--teal);padding:14px 16px;font-size:18px;margin-top:16px}
.mine b{display:block;font-size:14px;letter-spacing:.08em;color:var(--teal);margin-bottom:4px}

/* steps guide */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0}
.step{padding:18px;color:#fff}
.step:nth-child(1){background:var(--blue)}
.step:nth-child(2){background:var(--green)}
.step:nth-child(3){background:var(--orange)}
.step:nth-child(4){background:var(--purple)}
.step .n{font-family:var(--display);font-size:38px;line-height:1;margin-bottom:8px;display:block}
.step b{display:block;font-size:20px;margin-bottom:6px}
.step span{font-size:16px;opacity:.95;line-height:1.55}

/* judge */
.jsteps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.jstep{width:48px;height:48px;border:3px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.jstep.done{background:var(--green);border-color:var(--green);color:#fff}
.jstep.now{background:var(--navy);border-color:var(--navy);color:#fff}
.jwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.photo{position:relative;border:3px solid var(--navy)}
.photo img{width:100%}
.photo.fill{height:100%;min-height:clamp(300px,46vh,560px);overflow:hidden}
.photo.fill img{width:100%;height:100%;object-fit:cover;display:block}
.photo .tag{position:absolute;top:0;left:0;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:5px 10px}
.facts{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--blue);padding:14px 16px;margin-top:12px}
.facts li{margin-bottom:9px;font-size:19px;line-height:1.6}
.facts ul{margin:0;padding-left:18px}
.jbox{background:var(--paper);border:1px solid var(--line);padding:16px}
.jbox + .jbox{margin-top:12px}
.jbox.locked{opacity:.45;pointer-events:none}
.jbox h3{font-family:var(--display);font-size:21px;margin:0 0 12px;font-weight:400;display:flex;align-items:center;gap:8px}
.jbox h3 .k{width:30px;height:30px;background:var(--navy);color:#fff;font-family:var(--body);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.viva-verdict{display:flex;gap:12px;align-items:flex-start;background:var(--sky);border:2px solid var(--teal);padding:12px}
.viva-verdict .pic{width:70px;height:70px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:3px solid var(--teal)}
.viva-verdict .pic img{width:100%;height:100%;object-fit:cover}
.viva-verdict .q{font-family:var(--display);font-size:22px;line-height:1.55;font-weight:400}
.reacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.react{border:3px solid var(--line);background:var(--paper);padding:12px;font-weight:700;font-size:18px;min-height:58px;display:flex;align-items:center;justify-content:center;gap:6px}
.react .k{width:26px;height:26px;background:var(--navy);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.react.on{background:var(--purple);border-color:var(--purple);color:#fff}
.react.on .k{background:rgba(255,255,255,.3)}
.final{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--display);font-size:22px;font-weight:400}
.final select{font-family:var(--display);font-size:22px;padding:10px 12px;border:2px solid var(--blue);background:var(--paper);color:var(--ink)}
.final input{flex:1 1 240px;min-width:190px;border:0;border-bottom:4px solid var(--blue);padding:10px 4px;background:transparent;font-family:var(--body);font-size:19px}
.final input:focus{outline:none;border-bottom-color:var(--yellow);background:#FFFBEA}

/* chosung reveal popup */
.cho-modal{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,27,73,.82)}
.cho-card{background:var(--paper);border:8px solid var(--yellow);max-width:680px;width:100%;text-align:center;padding:clamp(24px,4vw,44px) 22px}
.cho-key{display:inline-block;background:var(--yellow);color:var(--navy);font-family:var(--display);font-size:clamp(26px,4vw,38px);padding:8px 24px;border:4px solid var(--yellow-d)}
.cho-arrow{font-size:30px;color:var(--ink-soft);margin:12px 0;line-height:1}
.cho-ans{font-family:var(--display);font-size:clamp(64px,14vw,132px);line-height:1.1;color:var(--blue);margin:0}
.cho-full{margin:18px 0 0;font-size:clamp(17px,2.2vw,22px);color:var(--ink-soft);line-height:1.7}
.cho-full b{color:var(--navy);background:var(--sky);padding:2px 8px}
.cho-full .cho-mask{display:inline-block;background:var(--yellow);color:var(--navy);font-family:var(--display);padding:2px 10px;border-radius:8px;letter-spacing:.06em}
.cho-card .btn{margin-top:22px}
.cho-pop{animation:chopop .34s cubic-bezier(.2,1.5,.5,1) both}
@keyframes chopop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cho-pop{animation:none}}

/* popup */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,27,73,.78)}
.modal-card{background:var(--paper);border:6px solid var(--yellow);max-width:620px;width:100%;max-height:92%;overflow-y:auto;text-align:center;padding:26px 22px;position:relative}
.modal-card .pic{width:190px;height:190px;border-radius:50%;overflow:hidden;margin:0 auto 14px;border:6px solid var(--teal)}
.modal-card .pic img{width:100%;height:100%;object-fit:cover}
.modal-card h2{font-family:var(--display);font-size:clamp(24px,4vw,34px);margin:0 0 10px;font-weight:400;color:var(--navy)}
.modal-card p{margin:0 0 10px;font-size:20px;line-height:1.7}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;font-family:var(--display);font-size:26px;padding:10px 18px;margin:12px 0;font-weight:400}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:14px 0 18px}
.tally div{padding:12px 8px;color:#fff}
.tally div:nth-child(1){background:var(--green)}
.tally div:nth-child(2){background:var(--orange)}
.tally div:nth-child(3){background:var(--purple)}
.tally b{display:block;font-family:var(--display);font-size:34px;font-weight:400;line-height:1.2}
.tally span{font-size:15px}
#confetti{position:fixed;inset:0;z-index:89;pointer-events:none}
.pop-in{animation:popin .5s cubic-bezier(.2,1.3,.5,1) both}
@keyframes popin{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop-in{animation:none}}

/* result */
.sheet{background:#fff;border:1px solid var(--line);padding:22px}
.sheet-h{border-bottom:4px solid var(--navy);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sheet-h h2{font-family:var(--display);font-size:28px;margin:0;font-weight:400}
.qa{margin-bottom:16px}
.qa h4{margin:0 0 8px;font-size:17px;background:var(--navy);color:#fff;display:inline-block;padding:4px 10px}
.qa .ans{border-left:5px solid var(--teal);background:var(--ground);padding:12px 14px;white-space:pre-wrap;min-height:52px;font-size:18px}
.rtable{width:100%;border-collapse:collapse;font-size:16px}
.rtable th,.rtable td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.rtable th{background:var(--navy);color:#fff;font-weight:700;white-space:nowrap}
.rtable td.v{white-space:nowrap;font-weight:700}
.tscroll{overflow-x:auto}
.v-city{color:var(--green)}
.v-rural{color:var(--orange)}
.v-unsure{color:var(--purple)}

/* next */
.next-hero{max-width:min(1180px, calc(56vh * 16 / 9));margin:0 auto;border:6px solid var(--navy);overflow:hidden;background:var(--sky)}
.next-hero img{width:100%;display:block}
.next-band{max-width:min(1180px, calc(56vh * 16 / 9));margin:0 auto;background:var(--navy);color:#fff;padding:20px clamp(18px,3vw,32px);display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.next-band h2{font-family:var(--display);font-size:clamp(22px,3.2vw,36px);margin:0;font-weight:400;text-wrap:balance}
.next-band span{font-size:18px;background:var(--yellow);color:var(--navy);font-weight:700;padding:8px 16px;white-space:nowrap}

/* responsive */
@media (max-width:980px){
  .puz,.observe,.jwrap,.cover{grid-template-columns:1fr}
  .cover{min-height:0}
  .cover-stage{min-height:320px}
  .cover-art{border-left:0;border-top:6px solid var(--teal);min-height:320px}
  .next-band{flex-direction:column;align-items:flex-start}
}
@media (max-width:760px){
  .rail{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:70;transform:translateX(-100%);transition:transform .25s ease;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,27,73,.5);z-index:69}
  .menu-btn{display:inline-flex}
  .brand-s{display:none}
  .screen{padding:16px 16px 22px}
  .btn{padding:12px 18px;font-size:17px;min-height:54px}
  .tally{grid-template-columns:1fr}
}
@media (min-width:1280px){ body{font-size:19px} }
@media (min-width:1600px){
  body{font-size:21px}
  .screen{padding:30px 26px 36px}
}
@media print{
  .topbar,.rail,.prog,.navbar,.no-print,.scrim{display:none !important}
  .app,.main,.stage,.scroller{display:block;height:auto;overflow:visible}
  .screen{display:none !important}
  .screen#s-result{display:block !important;max-width:none;padding:0}
  .sheet{border:0;padding:0}
  body{background:#fff}
}

/* ---------- playful, tactile theme ---------- */
:root{
  --navy:#26336f;--navy-2:#394a91;--blue:#526ce2;--blue-d:#415bc4;
  --blue-l:#91a5f6;--yellow:#ffd45a;--yellow-d:#eab63d;
  --green:#35b88a;--purple:#9671dc;--orange:#ff925d;--teal:#43bfc4;
  --sky:#e6f9ff;--ground:#f6f5ff;--line:#dcdff1;
  --ink:#273159;--ink-soft:#647095;--rail:248px;
}
body{background:radial-gradient(circle at 85% 8%,#fff0cf 0,transparent 28%),radial-gradient(circle at 15% 88%,#e3f8ff 0,transparent 34%),var(--ground)}
.topbar{background:linear-gradient(115deg,#344293,#5c66ce 65%,#7d73dc);box-shadow:0 6px 0 #29346e,0 12px 22px #35428c20;z-index:3;padding-left:22px;padding-right:22px}
.brand-mark{width:50px;height:50px;border:3px solid #fff;box-shadow:0 4px 0 #25336d,0 6px 12px #1e286b40}
.brand-t{font-size:25px;text-shadow:0 3px 0 #303d86}
.brand-s{color:#e1e7ff}
.tbtn{border:2px solid #ffffffa8;border-radius:15px;background:#ffffff24;box-shadow:0 4px 0 #25336d;padding:9px 14px;transition:transform .16s,box-shadow .16s,background .16s}
.tbtn:hover{background:#ffffff38;transform:translateY(-2px);box-shadow:0 6px 0 #25336d}
.tbtn:active{transform:translateY(4px);box-shadow:0 0 0 #25336d}
.tbtn.is-on{background:var(--yellow);border-color:#fff;color:var(--navy)}
.rail{background:linear-gradient(180deg,#6277dd,#7569cf);box-shadow:5px 0 18px #313c7830}
.rail-group{border-bottom:1px solid #ffffff39}
.rail-h{margin:6px 8px;width:calc(100% - 16px);border-radius:14px;padding:12px;min-height:54px;transition:background .18s,transform .18s}
.rail-h:hover{background:#ffffff24;transform:translateX(2px)}
.rail-h .gcount{border-radius:999px;background:#ffffff35}
.rail-group.open > .rail-h{background:#26336f;box-shadow:0 4px 0 #1c285b}
.rail-group.has-now > .rail-h{color:#ffe786}
.rail-items{background:#28357535;padding:6px 8px 10px}
.rail-i{border:0;border-radius:12px;padding:10px 12px 10px 20px;transition:background .18s,transform .18s}
.rail-i:hover{background:#ffffff26;transform:translateX(3px)}
.rail-i.is-now{background:#fff;color:var(--navy);box-shadow:0 4px 0 #c9cce9}
.rail-i .dot{border-radius:50%}
.stage{background:transparent}
.prog{background:#fffafc;border-bottom:2px solid #e6e4f4;padding:10px 20px}
.prog-bar{height:14px;border-radius:99px;background:#e5e6f3;box-shadow:inset 0 2px 4px #939cc240}
.prog-fill{border-radius:99px;background:linear-gradient(90deg,#37caa7,#8bdc78);box-shadow:inset 0 2px 0 #ffffff77}
.screen{padding:30px clamp(16px,3vw,40px) 36px}
.navbar{background:#fffafc;border-top:2px solid #e6e4f4;padding:13px 20px;padding-bottom:calc(13px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 22px #3441780b}
.btn,.chip,.choice,.react,.seg button,.zoom-ctl button,.play,.cho{transition:transform .16s ease,box-shadow .16s ease,filter .16s ease,background .16s ease}
.btn{border:2px solid #354ab5;border-radius:17px;background:linear-gradient(#6883f2,#526ce2);box-shadow:0 6px 0 #354ab5,0 9px 16px #354ab52d;text-shadow:0 1px 1px #26336f44}
.btn:hover{background:linear-gradient(#7990fa,#5b75e8);border-color:#354ab5;transform:translateY(-3px);box-shadow:0 9px 0 #354ab5,0 12px 19px #354ab52d}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #354ab5}
.btn.ghost{background:#fff;color:var(--navy);border-color:#cbd0ec;box-shadow:0 6px 0 #cbd0ec;text-shadow:none}
.btn.ghost:hover{background:#f0f4ff;border-color:#aeb8e7;box-shadow:0 9px 0 #aeb8e7}
.btn.ghost:active{box-shadow:0 1px 0 #aeb8e7}
.btn.go{background:linear-gradient(#ffe580,#ffd45a);border-color:#e4ad31;color:#4d3c1a;box-shadow:0 6px 0 #e4ad31,0 9px 16px #bf872d35;text-shadow:none}
.btn.go:hover{background:linear-gradient(#ffeb9a,#ffda65);border-color:#e4ad31;box-shadow:0 9px 0 #e4ad31,0 12px 19px #bf872d35}
.btn.go:active{box-shadow:0 1px 0 #e4ad31}
.btn[disabled]{opacity:.45;transform:none;box-shadow:0 3px 0 #aeb5d0;cursor:not-allowed}
.eyebrow,.cover .book,.badge,.done-badge,.count,.qa h4{border-radius:12px;box-shadow:0 4px 0 #25336d30}
h1.title{color:var(--navy);text-shadow:0 3px 0 #dbe2ff}
.viva-pic,.viva-verdict .pic,.modal-card .pic{box-shadow:0 5px 0 #248e97,0 8px 15px #248e9730}
.viva-say{border-radius:18px;box-shadow:0 5px 0 #b5e8e9,0 9px 17px #24376b13}
.card,.vid,.jbox,.sheet,.tray,.facts,.feat{border:2px solid #e0e3f2;border-radius:23px;box-shadow:0 7px 0 #d9dced,0 12px 25px #36407510}
.card,.jbox,.sheet{padding:22px}
.sect-h{color:var(--navy)}
textarea,input[type=text]{border-radius:15px;background:#fff;border-color:#dbe0f2;box-shadow:inset 0 3px 5px #4351900b;outline:none}
textarea:focus,input[type=text]:focus{border-color:var(--blue-l);box-shadow:0 0 0 4px #9cacf642}
.chip{border:2px solid #cbd1eb;border-radius:999px;background:#fff;box-shadow:0 4px 0 #cbd1eb;font-weight:700}
.chip:hover{border-color:#91a5f6;background:#eef2ff;transform:translateY(-2px);box-shadow:0 6px 0 #91a5f6}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 #91a5f6}
.chip.on{border-color:#354ab5;box-shadow:0 4px 0 #354ab5}
.chip.city.on{border-color:#218d69;box-shadow:0 4px 0 #218d69}
.chip.rural.on{border-color:#db7041;box-shadow:0 4px 0 #db7041}
.chip.del{background:#e6f9ff;border-color:#91d8e3;color:var(--navy);box-shadow:0 4px 0 #91d8e3}
.cover{border:3px solid #fff;border-radius:30px;background:linear-gradient(130deg,#f6efff,#e5f9ff 68%,#d7efff);box-shadow:0 10px 0 #d8dcef,0 18px 32px #3847771c}
.cover h1{color:var(--navy);text-shadow:0 4px 0 #cfd8fc}
.cover-art{border-left-color:#84d9df}
.viva-hi{border-radius:16px;box-shadow:0 5px 0 #26336f}
.art-tip{border-radius:10px}
.goals,.steps,.tally{gap:12px}
.goal,.step,.tally div{border-radius:18px;box-shadow:0 6px 0 #26336f35,0 10px 18px #26336f18}
.vid{overflow:hidden}.vid-h{background:linear-gradient(90deg,#344293,#686bd3)}
.vid-foot{border-top:2px solid #e4e6f4}
.play{box-shadow:0 7px 0 #e4ad31,0 12px 18px #0004}
.vid-cover:hover .play{transform:translateY(-3px) scale(1.05);box-shadow:0 10px 0 #e4ad31,0 15px 20px #0004}
.qr-box,.zoomwrap,.photo,.board,.next-hero{border-radius:22px;overflow:hidden;box-shadow:0 7px 0 #26336f2c}
.choice{border:3px solid #cbd1eb;border-radius:19px;box-shadow:0 7px 0 #cbd1eb,0 11px 18px #26336f13;white-space:normal}
.choice:hover{border-color:#91a5f6;background:#eef3ff;transform:translateY(-3px);box-shadow:0 10px 0 #91a5f6,0 14px 21px #26336f18}
.choice:active{transform:translateY(5px);box-shadow:0 2px 0 #91a5f6}
.choice.on-city{border-color:#218d69;box-shadow:0 7px 0 #218d69}
.choice.on-rural{border-color:#db7041;box-shadow:0 7px 0 #db7041}
.choice.on-unsure{border-color:#7152b8;box-shadow:0 7px 0 #7152b8}
.choice .num,.react .k,.jbox h3 .k,.feat .ico{border-radius:12px}
.seg{border-radius:16px;overflow:hidden;box-shadow:0 5px 0 #cbd1eb}
.seg button:hover{background:#edf2ff}.seg button.on{background:var(--blue)}
.board{border-color:var(--navy)}
.pieces{padding-bottom:5px}.piece.sel{border-radius:12px}
.zoom-ctl button{border-radius:12px;box-shadow:0 4px 0 #1b2658}
.zoom-ctl button:hover{transform:translateY(-2px);box-shadow:0 6px 0 #1b2658}
.cho{border-radius:12px;box-shadow:0 5px 0 #d9a937}
.cho.open{box-shadow:0 5px 0 #354ab5}
.feat{border-top-width:6px}.feat .ico{background:#edf7ff}
.mine,.viva-verdict{border-radius:18px;box-shadow:0 5px 0 #b5e8e9}
.jstep{border-radius:14px;box-shadow:0 4px 0 #cbd1eb}.jstep.now,.jstep.done{box-shadow:0 4px 0 #26336f55}
.photo .tag{border-bottom-right-radius:12px}
.react{border:2px solid #cbd1eb;border-radius:16px;box-shadow:0 5px 0 #cbd1eb}
.react:hover{transform:translateY(-2px);box-shadow:0 7px 0 #aeb9e8;background:#f0f4ff}
.react:active{transform:translateY(4px);box-shadow:0 1px 0 #aeb9e8}
.react.on{border-color:#7152b8;box-shadow:0 5px 0 #7152b8}
.final select{border-radius:13px;box-shadow:0 4px 0 #cbd1eb}
.modal,.cho-modal{background:#222d69bd;backdrop-filter:blur(6px)}
.modal-card,.cho-card{border-radius:28px;box-shadow:0 12px 0 #d9a937,0 24px 50px #111a4d55}
.cho-key{border-radius:15px;box-shadow:0 5px 0 #d9a937}
.cho-full b{border-radius:8px}
.qa .ans{border-radius:0 12px 12px 0}
.rtable th:first-child{border-top-left-radius:10px}
.next-band{border-radius:0 0 22px 22px}.next-band span{border-radius:12px;box-shadow:0 4px 0 #d9a937}
@media (max-width:760px){.screen{padding:20px 16px 30px}.topbar{padding-left:12px;padding-right:12px}.brand-t{font-size:21px}.tbtn{padding:8px 10px}.navbar{padding-left:12px;padding-right:12px}.goal,.step{border-radius:14px}}
@media (prefers-reduced-motion:reduce){.btn,.chip,.choice,.react,.tbtn,.rail-h,.rail-i,.play{transition:none}}
@media print{body{background:#fff}.sheet,.card{box-shadow:none}.screen{padding:0}}

/* ---------- blue + orange palette ---------- */
:root{
  --navy:#22336B; --navy-2:#35478F;
  --blue:#3D6BE0; --blue-d:#2B53BE; --blue-l:#8FAAF4;
  --yellow:#FFB53D; --yellow-d:#E09318;
  --green:#2E6FD8;          /* 도시다 · 완료 · 진행 = 파랑 */
  --orange:#E96A1E;         /* 도시가 아니다 · 활동 2 = 주황 */
  --teal:#F0863A;           /* 비바 강조 = 주황 */
  --purple:#5E6E93;         /* 잘 모르겠다 = 차분한 청회색 */
  --sky:#E9F1FE;
  --line:#D7DEEE;
  --ink:#1D2A52; --ink-soft:#5B6884;
}
body{background:radial-gradient(circle at 86% 8%,#FFE8CE 0,transparent 26%),radial-gradient(circle at 14% 88%,#E2ECFF 0,transparent 32%),#F7F8FC}
.topbar{background:linear-gradient(115deg,#22336B,#3D6BE0 70%,#5A85EC);box-shadow:0 6px 0 #1B2A5A,0 12px 22px #2a3c7a20}
.brand-t{text-shadow:0 3px 0 #22336B}
.brand-s{color:#D6E2FB}
.tbtn,.tbtn:hover{box-shadow:0 4px 0 #1B2A5A}
.tbtn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #1B2A5A}
.rail{background:linear-gradient(180deg,#3D6BE0,#2B53BE)}
.rail-group.open > .rail-h{background:#22336B;box-shadow:0 4px 0 #17244C}
.rail-group.has-now > .rail-h{color:#FFC978}
.rail-i.is-now{box-shadow:0 4px 0 #C3CEEA}
.prog-fill{background:linear-gradient(90deg,#2E6FD8,#5A8BEE)}
.prog-bar{background:#E2E6F2}

/* 표지 — 하늘색 바탕 + 주황 계열 카드 */
.cover{background:linear-gradient(130deg,#FFF4E8,#E9F1FE 68%,#DCE8FD);box-shadow:0 10px 0 #D5DCEE,0 18px 32px #2a3c7a1c}
h1.title,.cover h1{text-shadow:0 3px 0 #DDE7FF}
.goal:nth-child(1){background:#F6A85C}
.goal:nth-child(2){background:#EE8A33}
.goal:nth-child(3){background:#DF6B18}
.goal:nth-child(4){background:#C2520E}

/* 활동 2 안내 — 파랑에서 주황으로 */
.step:nth-child(1){background:#2B53BE}
.step:nth-child(2){background:#4E7AE4}
.step:nth-child(3){background:#EE8A33}
.step:nth-child(4){background:#DF6B18}

/* 특징 카드 — 파랑·주황 교차 */
.feat:nth-child(1){border-top-color:#2B53BE}
.feat:nth-child(2){border-top-color:#EE8A33}
.feat:nth-child(3){border-top-color:#2B53BE}
.feat:nth-child(4){border-top-color:#EE8A33}
.feat:nth-child(5){border-top-color:#2B53BE}

/* 판정 색 — 도시다=파랑, 아니다=주황, 모르겠다=청회색 */
.choice.on-city{border-color:#20459F;box-shadow:0 7px 0 #20459F}
.choice.on-rural{border-color:#B84F0F;box-shadow:0 7px 0 #B84F0F}
.choice.on-unsure{border-color:#44527A;box-shadow:0 7px 0 #44527A}
.chip.city.on{border-color:#20459F;box-shadow:0 4px 0 #20459F}
.chip.rural.on{border-color:#B84F0F;box-shadow:0 4px 0 #B84F0F}
.react.on{border-color:#44527A;box-shadow:0 5px 0 #44527A}
.chip.del{background:#FFEFE0;border-color:#F3C193;color:#8A4A12;box-shadow:0 4px 0 #F3C193}
.tally div:nth-child(1){background:#2E6FD8}
.tally div:nth-child(2){background:#DF6B18}
.tally div:nth-child(3){background:#5E6E93}

/* 비바 말풍선 — 주황 */
.viva-pic,.viva-verdict .pic,.modal-card .pic{box-shadow:0 5px 0 #C4671C,0 8px 15px #C4671C30}
.viva-say{box-shadow:0 5px 0 #FBD9BC,0 9px 17px #2a3c7a13}
.cover-art{border-left-color:#F0863A}
.vid-h{background:linear-gradient(90deg,#22336B,#3D6BE0)}
.next-hero{border-color:#22336B}


/* 선택된 버튼은 마우스를 올려도 색이 유지되도록 */
.choice.on-city,.choice.on-city:hover{background:#2E6FD8;color:#fff}
.choice.on-rural,.choice.on-rural:hover{background:#E96A1E;color:#fff}
.choice.on-unsure,.choice.on-unsure:hover{background:#5E6E93;color:#fff}
.choice.on-city .num,.choice.on-rural .num,.choice.on-unsure .num{background:rgba(255,255,255,.3);color:#fff}
.chip.on,.chip.on:hover{background:#3D6BE0;color:#fff}
.chip.city.on,.chip.city.on:hover{background:#2E6FD8;color:#fff}
.chip.rural.on,.chip.rural.on:hover{background:#E96A1E;color:#fff}
.react.on,.react.on:hover{background:#5E6E93;color:#fff}
.react.on .k{background:rgba(255,255,255,.3)}
.cho.open,.cho.open:hover{background:#3D6BE0;color:#fff}
.seg button.on{background:#22336B;color:#fff}

/* ---------- 9차시 추가 컴포넌트 (디자인 시스템 규칙에 맞춤) ---------- */
h1,h2,h3,p,.state,.band,.viva-say,label{word-break:keep-all}
.eyebrow.a3{background:var(--green)}
.eyebrow.a4{background:var(--orange)}
.state{background:var(--sky);border:2px solid #C9D9F8;border-radius:23px;box-shadow:0 7px 0 #C9D9F8;padding:18px 22px;font-family:var(--display);font-size:clamp(22px,2.6vw,34px);line-height:1.6;color:var(--navy);margin:0 0 20px;text-wrap:balance}
.state b{color:var(--orange);font-weight:400}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.fig{background:var(--paper);border:2px solid #E0E3F2;border-radius:22px;box-shadow:0 7px 0 #D9DCED;overflow:hidden;padding:0;display:block;width:100%;text-align:left;cursor:zoom-in;transition:transform .16s ease,box-shadow .16s ease}
.fig:hover{transform:translateY(-3px);box-shadow:0 10px 0 #C3CEEA}
.fig:active{transform:translateY(5px);box-shadow:0 1px 0 #C3CEEA}
.fig img{width:100%;max-height:40vh;object-fit:contain;background:#fff}
.fig span{display:block;padding:10px 16px;font-size:15px;font-weight:700;color:var(--ink-soft);border-top:2px solid #E4E6F4}
.lightbox{position:fixed;inset:0;z-index:96;background:#222d69d9;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:22px;border:6px solid #fff;background:#fff}
.vid-cover img.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.pop{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px;align-items:stretch}
.bignum{background:var(--green);color:#fff;border-radius:23px;box-shadow:0 7px 0 #20459F;padding:26px 18px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.bignum b{font-family:var(--display);font-weight:400;font-size:clamp(44px,7vw,92px);line-height:1.15}
.bignum span{font-size:16px;opacity:.95}
.reveal{margin-top:14px;background:#FFEFE0;border:2px solid #F3C193;border-radius:18px;box-shadow:0 5px 0 #F3C193;padding:14px 18px;font-family:var(--display);font-size:clamp(22px,2.4vw,30px);color:#8A4A12}
.reveal small{display:block;font-family:var(--body);font-size:14px;font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.three .t{background:var(--paper);border:2px solid #E0E3F2;border-top:8px solid #2B53BE;border-radius:23px;box-shadow:0 7px 0 #D9DCED;padding:20px;text-align:center}
.three .t:nth-child(2){border-top-color:#EE8A33}
.three .t .n{display:inline-flex;width:46px;height:46px;border-radius:14px;background:var(--navy);color:#fff;font-family:var(--display);font-size:22px;align-items:center;justify-content:center}
.three .t h3{font-family:var(--display);font-weight:400;font-size:34px;margin:8px 0 4px;color:var(--navy)}
.three .t p{margin:0 0 12px;font-size:19px}
.three .t em{display:block;font-style:normal;background:var(--sky);border-radius:12px;padding:8px;font-size:16px;font-weight:700;color:var(--ink-soft)}
.band{margin-top:18px;background:var(--navy);color:#fff;border-radius:18px;box-shadow:0 6px 0 #17244C;padding:14px 20px;text-align:center;font-family:var(--display);font-size:clamp(19px,2.2vw,26px)}
.chain{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:86px;background:var(--paper);border:3px dashed var(--line);border-radius:23px;padding:14px;margin-bottom:14px}
.link{font-family:var(--display);font-size:clamp(19px,2vw,26px);color:#fff;border-radius:17px;padding:14px 18px;min-height:58px;display:inline-flex;align-items:center;text-align:center;line-height:1.3}
.chain .link:nth-child(4n+1){background:#2B53BE;box-shadow:0 6px 0 #1B3A8C}
.chain .link:nth-child(4n+3){background:#4E7AE4;box-shadow:0 6px 0 #2B53BE}
.chain .link:nth-child(8n+5){background:#EE8A33;box-shadow:0 6px 0 #B84F0F}
.chain .link:nth-child(8n+7){background:#DF6B18;box-shadow:0 6px 0 #9C430B}
.chain .arr{font-size:26px;color:var(--ink-soft)}
.chain .ph{color:var(--ink-soft);font-size:17px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.two .ph2{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 7px 0 #26336f2c;aspect-ratio:16/10}
.two .ph2 img{width:100%;height:100%;object-fit:cover}
.tagb{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:clamp(19px,2vw,26px);color:#fff;padding:8px 22px;border-radius:999px;background:#2E6FD8;box-shadow:0 5px 0 #20459F}
.tagb.o{background:#E96A1E;box-shadow:0 5px 0 #B84F0F}
.match{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.mcard{background:var(--paper);border:2px solid #E0E3F2;border-radius:23px;box-shadow:0 7px 0 #D9DCED;overflow:hidden}
.mcard img{width:100%;aspect-ratio:16/10;object-fit:cover}
.mcard h3{font-family:var(--display);font-weight:400;font-size:28px;margin:10px 14px 8px;color:var(--navy)}
.mcard .chips{padding:0 12px 16px}
.mcard .book{margin:0 12px 14px;font-weight:700;color:#8A4A12;background:#FFEFE0;border-radius:12px;padding:8px 12px;font-size:16px}
.next9{display:grid;grid-template-columns:1.1fr .9fr;gap:0;background:var(--navy);color:#fff;border-radius:28px;box-shadow:0 10px 0 #17244C;overflow:hidden;max-width:1180px;margin:0 auto}
.next9 .tx{padding:clamp(22px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.next9 h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,58px);line-height:1.2;margin:0}
.next9 .cities{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px}
.next9 .cities span{font-family:var(--display);font-size:24px;text-align:center;padding:10px;border-radius:999px;background:#35478F;box-shadow:0 5px 0 #17244C}
.next9 .cities span:first-child{background:var(--yellow);color:#4d3c1a;box-shadow:0 5px 0 var(--yellow-d)}
.next9 .im{background:var(--sky)}
.next9 .im img{width:100%;height:100%;object-fit:cover}
.rv{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 10px}
.rv .cho{font-size:clamp(34px,6vw,76px);padding:14px 34px;border-radius:999px;min-width:60%}
.chip.ok.on,.chip.ok.on:hover{background:#2E6FD8;color:#fff;border-color:#20459F;box-shadow:0 4px 0 #20459F}
@media (max-width:980px){.pop,.next9{grid-template-columns:1fr}}

/* ---------- 11차시 추가 컴포넌트 (디자인 시스템 규칙에 맞춤) ---------- */
.std{display:inline-block;margin-top:18px;background:var(--sky);border-radius:12px;padding:8px 16px;font-size:16px;font-weight:700;color:var(--ink-soft)}
.remind{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.remind div{border-radius:18px;padding:14px 12px;color:#fff;text-align:center;box-shadow:0 6px 0 #26336f35}
.remind div:nth-child(odd){background:#2B53BE}
.remind div:nth-child(even){background:#EE8A33}
.remind b{display:block;font-family:var(--display);font-weight:400;font-size:26px}
.remind span{font-size:16px}

/* 표지 — 그림을 통째로(잘림 없이) 보여 주는 세로 배치 */
.cover.full{display:block;min-height:0;padding:clamp(16px,2.2vw,28px)}
.cover.full .cover-text{padding:0 0 clamp(12px,1.6vw,20px);display:block}
.cover.full .cover-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.cover.full h1{font-size:clamp(28px,4vw,50px);margin:10px 0 6px}
.cover.full .cover-meta{margin-top:0}
.cover.full .cover-stage{perspective:none;min-height:0;width:100%;max-width:calc(41vh * 1672 / 941 + 16px);margin:0 auto}
.cover.full .cover-art{border:0;height:auto;min-height:0;border-radius:22px;box-shadow:0 7px 0 #26336f2c;background:#fff;padding:8px;overflow:visible}
.cover.full .cover-art img{width:100%;height:auto;aspect-ratio:1672 / 941;object-fit:contain;border-radius:0}   /* 모서리도 깎지 않습니다 */
.cover.full .art-tilt,.cover.full .art-bob{transform:none !important;animation:none !important;height:100%}
.cover.full .art-note{text-align:center;font-size:14px;color:var(--ink-soft);margin:12px 0 0}

/* 사진 카드 — 먼저 말해 보고, 설명 열기 */
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;align-items:start}
.shots.four{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.shot{background:var(--paper);border:2px solid #E0E3F2;border-radius:23px;box-shadow:0 7px 0 #D9DCED;overflow:hidden}
.shot .im{display:block;width:100%;padding:0;cursor:zoom-in}
.shot .im img{width:100%;aspect-ratio:16/10;object-fit:cover}
.shot .cap{padding:12px 14px 16px;min-height:86px;display:flex;align-items:center;justify-content:center;text-align:center}
.shot .cap p{margin:0;font-family:var(--display);font-size:clamp(19px,1.7vw,23px);line-height:1.45;color:var(--navy);word-break:keep-all}
.after{margin-top:20px}

/* 시설 분류 */
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bin{background:var(--paper);border:3px dashed #C3CEEA;border-radius:23px;padding:12px;min-height:112px;text-align:left;display:block;width:100%;transition:background .16s ease,border-color .16s ease}
.bin:hover,.bin.hot{border-color:var(--yellow);background:#FFF8E8}
.bin h3{display:inline-block;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(19px,1.9vw,24px);color:#fff;border-radius:12px;padding:5px 14px;white-space:nowrap}
.bin:nth-child(odd) h3{background:#2B53BE;box-shadow:0 4px 0 #1B3A8C}
.bin:nth-child(even) h3{background:#EE8A33;box-shadow:0 4px 0 #B84F0F}
.bin small{display:block;margin-top:8px;font-size:15px;color:var(--ink-soft);font-weight:500}
.bin .in{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bin .in span{background:var(--sky);border-radius:999px;padding:4px 12px;font-size:16px;font-weight:700;color:var(--navy)}
.pool{margin-top:16px;position:sticky;bottom:6px;z-index:5}
.pool .chip{touch-action:none;font-size:19px;min-height:54px}
.pool .chip.sel,.pool .chip.sel:hover{background:var(--yellow);border-color:var(--yellow-d);box-shadow:0 4px 0 var(--yellow-d);color:#4d3c1a}
.ghost-chip{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%);background:var(--yellow);color:#4d3c1a;border-radius:999px;padding:9px 16px;font-weight:700;font-size:19px;box-shadow:0 6px 0 var(--yellow-d);white-space:nowrap}

/* 좋은 점 카드 */
.feat .ico{font-family:var(--display);font-size:24px;color:var(--navy)}

/* 편리한 점 · 불편한 점 */
.lab{display:inline-block;font-family:var(--display);font-size:22px;color:#fff;border-radius:12px;padding:5px 16px;margin-bottom:10px;background:#2E6FD8;box-shadow:0 4px 0 #20459F}
.lab.o{background:#E96A1E;box-shadow:0 4px 0 #B84F0F}
.card.good{border-top:8px solid #2E6FD8}
.card.bad{border-top:8px solid #E96A1E}

/* SNS 게시물 */
.sns{background:#fff;border:2px solid #E0E3F2;border-radius:23px;box-shadow:0 7px 0 #D9DCED;overflow:hidden;width:100%;max-width:480px;margin:0 auto}
.sns-h{display:flex;align-items:center;gap:10px;padding:10px 14px}
.sns-h .av{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--sky);border:2px solid #F0863A}
.sns-h .av img{width:100%;height:100%;object-fit:cover}
.sns-h b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--navy)}
.sns-h .kind{margin-left:auto;font-size:14px;font-weight:700;color:#fff;border-radius:999px;padding:4px 12px;background:#2E6FD8;white-space:nowrap}
.sns-h .kind.o{background:#E96A1E}
.sns-h .kind.q{background:#5E6E93}
.sns-img{aspect-ratio:16/10;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-weight:700;font-size:16px;text-align:center}
.sns-img img{width:100%;height:100%;object-fit:cover}
.sns-ico{display:flex;gap:12px;padding:10px 16px 0;color:var(--navy)}
.sns-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sns-b{padding:8px 16px 16px}
.sns-txt{margin:0;font-size:18px;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.sns-txt.empty{color:#9AA5BF}
.sns-tags{margin:6px 0 0;font-weight:700;color:#2B53BE;line-height:1.6;overflow-wrap:anywhere}
.sns-tags.o{color:#B84F0F}
.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:14px auto 0}
.pick2 .choice{min-height:64px;font-size:clamp(18px,1.7vw,22px);padding:10px 6px;white-space:nowrap}
.fb{min-height:1.7em;margin:10px auto 0;max-width:480px;text-align:center;font-weight:700;color:var(--ink-soft);font-size:17px}

/* 게시물 만들기 */
.seg button.on.k-good{background:#2E6FD8}
.seg button.on.k-bad{background:#E96A1E}
.mk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:18px;align-items:start;margin-top:16px}
.mk h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--navy)}
.mk h3 .k{width:30px;height:30px;border-radius:12px;background:var(--navy);color:#fff;font-family:var(--body);font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.mk .blk + .blk{margin-top:20px;padding-top:18px;border-top:2px solid #E4E6F4}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.thumb-b{border:3px solid var(--line);border-radius:14px;overflow:hidden;padding:0;aspect-ratio:16/10;background:var(--sky)}
.thumb-b img{width:100%;height:100%;object-fit:cover}
.thumb-b:hover{border-color:var(--blue-l)}
.thumb-b.on,.thumb-b.on:hover{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow-d)}
.draw canvas{display:block;width:100%;aspect-ratio:16/10;border:3px solid var(--line);border-radius:18px;background:#fff;touch-action:none;cursor:crosshair}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 4px var(--yellow)}
.tagrow{display:flex;gap:8px;margin-top:12px}
.tagrow input{flex:1 1 auto;min-width:0}
.mytags{min-height:54px;margin-top:12px}
.prev-h{font-weight:700;font-size:15px;color:var(--ink-soft);margin:0 0 10px;text-align:center}

/* 마무리 문제 */
.q + .q{margin-top:16px}
.q .qt{font-family:var(--display);font-size:clamp(20px,2.1vw,27px);line-height:1.5;margin:0 0 14px;color:var(--navy);display:flex;gap:10px;align-items:flex-start}
.q .qt .k{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.q .choice{min-height:68px;font-size:clamp(19px,1.9vw,24px)}
.q .qfb{min-height:1.7em;margin:12px 0 0;font-weight:700;font-size:17px;color:var(--ink-soft)}
.q .qfb.ok{color:#20459F}

@media (max-width:980px){.mk{grid-template-columns:1fr}}
@media (max-width:760px){.bins{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.sns{box-shadow:none}}

/* ---------- 12차시 추가 컴포넌트 (디자인 시스템 규칙에 맞춤) ---------- */
/* 네 가지 도시 문제 — 파랑·주황 교차 (주택·교통·환경·안전) */
.bins.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.bins.four .bin:nth-child(1) h3,.col:nth-child(1) .col-h{background:#2B53BE;box-shadow:0 4px 0 #1B3A8C}
.bins.four .bin:nth-child(2) h3,.col:nth-child(2) .col-h{background:#EE8A33;box-shadow:0 4px 0 #B84F0F}
.bins.four .bin:nth-child(3) h3,.col:nth-child(3) .col-h{background:#4E7AE4;box-shadow:0 4px 0 #2B53BE}
.bins.four .bin:nth-child(4) h3,.col:nth-child(4) .col-h{background:#DF6B18;box-shadow:0 4px 0 #9C430B}

/* 그림에서 문제 찾기 */
.zoomwrap.pic{background:#fff;cursor:zoom-in;display:block;width:100%;padding:0}
.zoomwrap.pic img{width:100%;height:auto}

/* 표지 — 정사각형 그림을 자르지 않고 보여 줍니다 */
.cover.sq{grid-template-columns:minmax(0,1fr) min(48%,62vh);min-height:0}
.cover.sq .cover-stage{aspect-ratio:1/1;min-height:0}
.cover.sq .cover-art{min-height:0;background:#BFDDF7}
.cover.sq .art-bob{animation-name:bobsq}
@keyframes bobsq{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}
.cover.sq .cover-art.pop .art-bob{animation:hopsq .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes hopsq{0%{transform:none}35%{transform:translateY(-14px) scale(1.03)}70%{transform:translateY(5px)}100%{transform:none}}

/* 가중치 */
.wrows{display:grid;gap:14px}

.formula{margin:18px 0 0;background:var(--ground);border-radius:14px;padding:12px 16px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;word-break:keep-all;line-height:1.7}

.towns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}

@media (max-width:1100px){.towns{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media print{.town,.ccard,.cmts{box-shadow:none}}

var actx=null;
function beep(kind){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    var notes = kind==="win" ? [523,659,784,1047] : kind==="no" ? [330] : [880];
    notes.forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, actx.currentTime+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.18, actx.currentTime+i*0.12+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+i*0.12+0.22);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+i*0.12); o.stop(actx.currentTime+i*0.12+0.25);
    });
  }catch(e){}
}

/* 문장 → 기준 (낱말을 보고 알아듣는 아주 단순한 ‘AI’ · 댓글 태그에 씁니다) */
function parseW(text){
  var w = [1,1,1,1], hit = [[],[],[],[]], seen = [false,false,false,false];
  String(text||"").split(/[,.!?\n·]|그리고|하지만|지만|또한|또 /).forEach(function(p){
    var idx = [];
    WKEY.forEach(function(ks,i){ ks.forEach(function(k){ if (p.indexOf(k)>=0){ if (idx.indexOf(i)<0) idx.push(i); if (hit[i].indexOf(k)<0) hit[i].push(k); } }); });
    if (!idx.length) return;
    var lv = /덜|별로|중요하지 않|안 중요|필요 없|필요하지 않/.test(p) ? 0 : /가장|제일|최고|무엇보다|첫째|1순위|으뜸/.test(p) ? 3 : 2;
    idx.forEach(function(i){ w[i] = seen[i] ? Math.max(w[i], lv) : lv; seen[i] = true; });
  });
  return {w:w, hit:hit};
}
function wLabel(w){ return IND.map(function(x,i){ return x.k+" ×"+w[i]; }).join(" · "); }

var rail = document.getElementById("rail"), GROUPS = [];
(function(){
  SCREENS.forEach(function(s,i){
    var g = GROUPS[GROUPS.length-1];
    if (!g || g.name !== s.group){ g = {name:s.group, from:i, to:i}; GROUPS.push(g); } else g.to = i;
  });
  var chev = '<svg class="chev" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M4 1l5 5-5 5z"/></svg>';
  rail.innerHTML = GROUPS.map(function(g, gi){
    var items = "";

    return '<div class="rail-group" data-g="'+gi+'"><button class="rail-h" data-toggle="'+gi+'" aria-expanded="false">'+chev+'<span>'+g.name+'</span><span class="gcount">'+(g.to-g.from+1)+'</span></button><div class="rail-items" hidden>'+items+'</div></div>';
  }).join("");
})();
function setGroups(fn){
  var gs = rail.querySelectorAll(".rail-group");
  for (var i=0;i<gs.length;i++){
    var want = fn(i, gs[i]);
    gs[i].classList.toggle("open", want);
    gs[i].querySelector(".rail-items").hidden = !want;
    gs[i].querySelector(".rail-h").setAttribute("aria-expanded", String(want));
  }
}
function groupOf(n){ for (var i=0;i<GROUPS.length;i++) if (n>=GROUPS[i].from && n<=GROUPS[i].to) return i; return 0; }

/* ===================== navigation ===================== */
var visited = {}, ENTER = {};
function go(i, push){
  i = Math.max(0, Math.min(SCREENS.length-1, i));
  S.screen = i; visited[i] = true; save();
  var secs = scroller.querySelectorAll(".screen");
  for (var k=0;k<secs.length;k++) secs[k].classList.toggle("is-now", k===i);
  var items = rail.querySelectorAll(".rail-i");
  for (var m=0;m<items.length;m++){
    items[m].classList.toggle("is-now", m===i);
    items[m].classList.toggle("is-done", !!visited[m] && m!==i);
  }
  var gi = groupOf(i);
  setGroups(function(n){ return n===gi; });
  var gsx = rail.querySelectorAll(".rail-group");
  for (var g=0; g<gsx.length; g++) gsx[g].classList.toggle("has-now", g===gi);
  document.getElementById("progT").textContent = (i+1)+" / "+SCREENS.length;
  document.getElementById("progName").textContent = SCREENS[i].label;
  document.getElementById("progFill").style.width = ((i+1)/SCREENS.length*100)+"%";
  document.getElementById("prevBtn").disabled = (i===0);
  var nb = document.getElementById("nextBtn");
  nb.disabled = (i===SCREENS.length-1);
  nb.textContent = (i===SCREENS.length-1) ? "마지막 화면" : "다음 화면 ▶";
  scroller.scrollTop = 0;
  closeRail();
  makeQRs(secs[i]);
  var id = SCREENS[i].id;
  document.body.classList.toggle("on-sim", id==="sim");
  if (ENTER[id]) ENTER[id]();
  if (push !== false){ try{ history.replaceState(null,"","#"+id); }catch(e){} }
}

  if (t){ var gi = parseInt(t.getAttribute("data-toggle"),10); var was = t.parentElement.classList.contains("open"); setGroups(function(n){ return n===gi && !was; }); return; }
  var b = e.target.closest("[data-go]"); if(b) go(parseInt(b.getAttribute("data-go"),10));
});

(function(){
  var art = document.getElementById("coverArt"), tilt = document.getElementById("artTilt"), stage = art.parentElement;
  var HI = ["안녕! 오늘은 살기 좋은 도시 설계소예요.","살기 좋은 도시는 어떤 곳일까요?","정답은 하나가 아니에요. 기준을 정해 봐요!"], n = 0, tm;
  function hi(){
    var old = stage.querySelector(".viva-hi"); if (old) old.remove();
    stage.appendChild(el('<div class="viva-hi">'+HI[n++ % HI.length]+'</div>'));
    art.classList.remove("pop"); void art.offsetWidth; art.classList.add("pop");
    beep(); clearTimeout(tm);
    tm = setTimeout(function(){ var o = stage.querySelector(".viva-hi"); if (o) o.remove(); art.classList.remove("pop"); }, 2600);
  }
  art.addEventListener("click", hi);
  art.addEventListener("keydown", function(e){ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); hi(); } });
  if (!REDUCE){
    art.addEventListener("pointermove", function(e){
      var r = art.getBoundingClientRect();
      tilt.style.setProperty("--px", (((e.clientX-r.left)/r.width)-.5)*8+"deg");
      tilt.style.setProperty("--py", (.5-((e.clientY-r.top)/r.height))*6+"deg");
    });
    art.addEventListener("pointerleave", function(){ tilt.style.setProperty("--px","0deg"); tilt.style.setProperty("--py","0deg"); });
  }
})();

/* ===================== lightbox · reveal · QR ===================== */
scroller.addEventListener("click", function(e){
  var z = e.target.closest("[data-zoom]");
  if (z){
    var lb = el('<div class="lightbox" role="dialog" aria-modal="true" aria-label="크게 보기" tabindex="0"><img src="'+z.getAttribute("data-zoom")+'" alt=""></div>');
    var close = function(){ if (lb.parentElement) lb.remove(); document.removeEventListener("keydown", key); z.focus(); };
    var key = function(ev){ if (ev.key==="Escape"||ev.key==="Enter"){ ev.preventDefault(); close(); } };
    lb.addEventListener("click", close); document.addEventListener("keydown", key);
    document.body.appendChild(lb); lb.focus(); return;
  }
  var r = e.target.closest("[data-rev]");
  if (r){ S.open[r.getAttribute("data-rev")] = true; save(); paintReveals(); beep(); }
});
function makeQRs(sec){
  var bs = sec.querySelectorAll("[data-qr]");
  for (var i=0;i<bs.length;i++){
    var box = bs[i]; if (box.getAttribute("data-made")) continue;
    box.setAttribute("data-made","1");
    try{ new QRCode(box, {text:LINKS[box.getAttribute("data-qr")], width:140, height:140, colorDark:"#22336B", colorLight:"#ffffff"}); }
    catch(e){ box.innerHTML = '<span class="hint">버튼을 눌러 접속하세요</span>'; }
  }
}
function paintReveals(){
  var bs = scroller.querySelectorAll("[data-revbox]");
  for (var i=0;i<bs.length;i++) bs[i].hidden = !S.open[bs[i].getAttribute("data-revbox")];
  var once = scroller.querySelectorAll("[data-once]");
  for (var k=0;k<once.length;k++) once[k].parentElement.hidden = !!S.open[once[k].getAttribute("data-rev")];
}
paintReveals();

/* ===================== inputs ===================== */
var onInput = {};
(function(){
  var ts = scroller.querySelectorAll("[data-t]");
  for (var i=0;i<ts.length;i++) ts[i].value = S.t[ts[i].getAttribute("data-t")] || "";
  scroller.addEventListener("input", function(e){
    var k = e.target.getAttribute && e.target.getAttribute("data-t");
    if (!k) return;
    S.t[k] = e.target.value; save();
    if (onInput[k]) onInput[k]();
  });
})();
function setText(k, v){ S.t[k] = v; save(); var n = document.getElementById("t-"+k); if (n) n.value = v; if (onInput[k]) onInput[k](); }

/* ===================== chosung ===================== */
function choPopup(i){
  var m = el('<div class="cho-modal" role="dialog" aria-modal="true" aria-label="정답"><div class="cho-card cho-pop">'+
    '<span class="cho-key">'+CHO[i].cho+'</span><div class="cho-arrow">▼</div>'+
    '<p class="cho-ans" style="'+(CHO[i].ans.length>4?"font-size:clamp(44px,9vw,92px)":"")+'">'+CHO[i].ans+'</p>'+
    '<button class="btn go">확인</button></div></div>');
  document.body.appendChild(m);
  var ok = m.querySelector(".btn"); ok.focus();
  function close(){ if (m.parentElement) m.remove(); document.removeEventListener("keydown", key); }
  function key(e){ if (e.key==="Escape"||e.key==="Enter"){ e.preventDefault(); close(); } }
  ok.addEventListener("click", close);
  m.addEventListener("click", function(e){ if (e.target===m) close(); });
  document.addEventListener("keydown", key);
  beep();
}
function paintCho(){
  var bs = scroller.querySelectorAll("[data-cho]");
  for (var k=0;k<bs.length;k++){
    var i = parseInt(bs[k].getAttribute("data-cho"),10), open = S.cho.indexOf(i)>=0;
    bs[k].classList.toggle("open", open); bs[k].textContent = open ? CHO[i].ans : CHO[i].cho;
  }
}
scroller.addEventListener("click", function(e){
  var b = e.target.closest("[data-cho]"); if (!b || b.classList.contains("open")) return;
  var i = parseInt(b.getAttribute("data-cho"),10);
  S.cho.push(i); save(); paintCho(); choPopup(i);
});
paintCho();

/* ===================== 고르기 칩 ===================== */
function picker(boxId, attr, list, after){
  var box = document.getElementById(boxId);
  function paint(){
    var cs = box.querySelectorAll("["+attr+"]");
    for (var i=0;i<cs.length;i++){ var on = list().indexOf(cs[i].getAttribute(attr))>=0; cs[i].classList.toggle("on", on); cs[i].setAttribute("aria-pressed", String(on)); }
    if (after) after();
  }
  box.addEventListener("click", function(e){
    var c = e.target.closest("["+attr+"]"); if (!c) return;
    var v = c.getAttribute(attr), l = list(), at = l.indexOf(v);
    if (at>=0) l.splice(at,1); else l.push(v);
    save(); paint(); beep();
  });
  paint();
}
picker("motChips", "data-mot", function(){ return S.mot; }, function(){ document.getElementById("motCount").textContent = "· "+S.mot.length+" / "+MOT_FIND.length; });

/* 하나만 고르기 */
function single(boxId, attr, get, set, after){
  var box = document.getElementById(boxId);
  function paint(){
    var cs = box.querySelectorAll("["+attr+"]");
    for (var i=0;i<cs.length;i++){ var on = cs[i].getAttribute(attr)===String(get()); cs[i].classList.toggle("on", on); cs[i].setAttribute("aria-pressed", String(on)); }
    if (after) after();
  }
  box.addEventListener("click", function(e){
    var c = e.target.closest("["+attr+"]"); if (!c) return;
    var v = c.getAttribute(attr); set(String(get())===v ? null : v);
    save(); paint(); beep();
  });
  paint();
}
single("probBox", "data-prob", function(){ return S.prob; }, function(v){ S.prob = v || ""; }, function(){
  var s = document.getElementById("probSay"), cat = "";
  PROB.forEach(function(p){ if (p.items.indexOf(S.prob)>=0) cat = p.cat; });
  s.hidden = !S.prob;
  if (S.prob) s.innerHTML = "내가 가장 해결하고 싶은 문제는 <b>"+esc(S.prob)+"</b>("+cat+")입니다.";
});
single("condChips", "data-cond", function(){ return S.cond; }, function(v){ S.cond = v===null ? -1 : parseInt(v,10); });
function condText(){ return (S.t.condown||"").trim() || (S.cond>=0 ? CONDS[S.cond] : ""); }

/* ===================== 댓글 ===================== */
(function(){
  var box = document.getElementById("cmts"), hint = document.getElementById("cmtHint");
  function tagOf(text){ var p = parseW(text), best = -1, n = 0; p.hit.forEach(function(h,i){ if (h.length>n){ n = h.length; best = i; } }); return best; }
  function paint(){
    var h = CMTS.map(function(c,i){
      var on = S.likes.indexOf(i)>=0, tg = TAGS[c.tag];
      return '<div class="cmt"><span class="av">'+(i+1)+'</span><div class="bub"><span class="who">궁금이네 모둠 친구 '+(i+1)+'</span><p>'+esc(c.t)+'</p>'+
        '<div class="meta"><span class="tg" style="--c:'+tg.c+'">#'+tg.k+'</span><button class="lk'+(on?" on":"")+'" data-like="'+i+'" aria-pressed="'+on+'">👍 공감'+(on?" 1":"")+'</button></div></div></div>';
    }).join("");
    if (S.posted && (S.t.cmt||"").trim()){
      var ti = tagOf(S.t.cmt);
      h += '<div class="cmt me"><span class="av">나</span><div class="bub"><span class="who">나</span><p>'+esc(S.t.cmt)+'</p>'+
        '<div class="meta">'+(ti>=0 ? '<span class="tg" style="--c:'+IND[ti].c+'">#'+IND[ti].k+'</span>' : '')+'</div></div></div>';
    }
    box.innerHTML = h;
  }
  box.addEventListener("click", function(e){
    var b = e.target.closest("[data-like]"); if (!b) return;
    var i = parseInt(b.getAttribute("data-like"),10), at = S.likes.indexOf(i);
    if (at>=0) S.likes.splice(at,1); else S.likes.push(i);
    save(); paint(); beep();
  });
  document.getElementById("sendBtn").addEventListener("click", function(){
    var t = (S.t.cmt||"").trim();
    if (!t){ hint.textContent = "먼저 댓글을 한 줄 써 주세요."; return; }
    S.posted = true; save(); paint(); beep("win");
    var ti = tagOf(t);
    hint.innerHTML = ti>=0 ? "비바가 읽어 보니 <b>‘"+IND[ti].k+"’</b>을 중요하게 생각하는 댓글이네요. 고치고 싶으면 다시 쓰고 전송하세요."
      : "댓글을 달았어요! 고치고 싶으면 다시 쓰고 전송하세요.";
  });
  onInput.cmt = function(){ hint.textContent = ""; };
  paint();
})();

/* ===================== 3D 도시 설계소 ===================== */
(function(){
  var fr = document.getElementById("gframe"), st = document.getElementById("gstat");
  function paint(){
    var g = game();
    st.classList.toggle("ok", !!g);
    st.innerHTML = g
      ? (g.done ? '✅' : '🏗️')+' <b>'+esc(g.em+" "+g.t)+'</b> '+(g.done ? '<span class="st">'+starTxt(g.stars)+'</span> 미션 성공 · ' : '설계 중 · ')+
        '시설 '+g.used.reduce(function(a,u){ return a+u.k; },0)+'개 · '+IND.map(function(x,i){ return x.k+" "+g.score[i]; }).join(" · ")+' — 지금 설계 중인 이 도시가 뒤 화면(소개 카드 · 닮은 점 · 설계 기록)에 이어져요.'
      : '💡 시설을 하나 지으면, 지금 설계 중인 도시가 뒤 화면(소개 카드 · 생태 도시와 닮은 점 · 설계 기록)에 저절로 이어져요.';
  }
  ENTER.sim = function(){ if (!fr.getAttribute("src")) fr.setAttribute("src", GAME); paint(); };
  window.addEventListener("storage", function(e){ if (e.key===GAME_KEY) paint(); });
  setInterval(function(){ if (SCREENS[S.screen].id==="sim") paint(); }, 2000);   // 같은 창 안(iframe)에서 저장했을 때를 대비
  paint();
})();

/* ===================== 도시 소개 카드 ===================== */
ENTER.card = function(){
  var g = game(), v = myV(), cond = condText(), why = (S.t.why||"").trim();
  document.getElementById("ccard").innerHTML =
    '<div class="top"><h2>⭐ '+esc(cityName())+'</h2>'+(cond ? '<span class="cond">'+esc(cond)+'</span>' : '<span class="hint">(조건을 아직 고르지 않았어요)</span>')+'</div>'+
    '<div class="body"><div>'+(g ? '<span class="mtag" style="--mc:'+esc(g.c||"#22336B")+'">'+esc(g.em+" "+g.t)+' 미션 · '+(g.done ? starTxt(g.stars) : '설계 중')+'</span>'+
        (g.thumb ? '<img class="gshot" src="'+g.thumb+'" alt="내가 3D로 설계한 도시">' : '<div class="gnone">설계도 그림이 없어요</div>')
        : '<div class="gnone">3D 도시 설계소에서 시설을 지으면<br>내가 설계한 도시가 여기에 나타나요</div>')+'</div>'+
      '<div>'+gaugeRows(v)+
      '<div class="score"><b>'+(g ? score(v,g.W)+'점' : '-')+'</b><span>삶의 질 점수'+(g && g.weighted ? ' · 우리 기준 '+wLabel(g.W) : '')+'</span></div>'+
      (g ? '<p class="hint" style="margin:10px 0 0">지은 시설 '+g.used.reduce(function(a,u){ return a+u.k; },0)+'개 · 쓴 예산 '+g.spent+' / '+g.budget+'</p>' : '')+'</div></div>'+
    '<div class="why"><b>이 조건을 중요하게 생각하는 까닭</b>'+(why ? esc(why) : none("아직 쓰지 않았어요"))+'</div>';
};
document.getElementById("saveCard").addEventListener("click", function(){ snap("ccard", "살기좋은도시_소개카드.png"); });
function snap(id, name){
  if (typeof html2canvas === "undefined"){ window.print(); return; }
  html2canvas(document.getElementById(id), {backgroundColor:"#ffffff", scale:2}).then(function(cv){
    var a = document.createElement("a"); a.download = name; a.href = cv.toDataURL("image/png");
    document.body.appendChild(a); a.click(); a.remove();
  }).catch(function(){ window.print(); });
}

/* ===================== 생태 도시와 닮은 점 ===================== */
ENTER.ecomatch = function(){
  var g = game(), cnt = {};
  if (g) g.used.forEach(function(u){ cnt[u.id] = u.k; });
  document.getElementById("likes").innerHTML = ECO.map(function(x,i){
    var mine = x.ids.filter(function(id){ return cnt[id]; });
    return '<div class="card"><span class="lab'+(i?" o":"")+'">'+x.n+'와 닮은 점</span><div class="chips">'+
      (mine.length ? mine.map(function(id){ return '<span class="chip on" style="cursor:default">'+ECO_N[id]+'</span>'; }).join("")
        : '<p class="hint" style="margin:0">'+(g ? "아직 닮은 시설이 없어요. " : "3D 도시 설계소에서 시설을 지으면 비바가 찾아 줄게요. ")+x.ids.map(function(id){ return ECO_N[id]; }).join(", ")+' 같은 시설이 있으면 닮게 돼요.</p>')+
      '</div></div>';
  }).join("");
};

/* ===================== 도시 선언문 ===================== */
document.getElementById("s-declare").addEventListener("click", function(e){
  var b = e.target.closest("[data-decl]"); if (!b) return;
  setText("decl", DECL_EX[parseInt(b.getAttribute("data-decl"),10)]); beep();
});

/* ===================== 마무리 문제 ===================== */
(function(){
  var sec = document.getElementById("s-quiz");
  function paint(){
    var qs = sec.querySelectorAll("[data-q]");
    for (var i=0;i<qs.length;i++){
      var q = QUIZ[i], pick = S.quiz[i], bs = qs[i].querySelectorAll(".choice"), fb = qs[i].querySelector(".qfb");
      for (var k=0;k<bs.length;k++){
        bs[k].classList.toggle("on-city", pick===k && k===q.a);
        bs[k].classList.toggle("on-unsure", pick===k && k!==q.a);
        bs[k].setAttribute("aria-pressed", String(pick===k));
      }
      fb.textContent = pick===undefined ? "" : pick===q.a ? q.ok : q.no;
      fb.classList.toggle("ok", pick===q.a);
    }
  }
  sec.addEventListener("click", function(e){
    var b = e.target.closest("[data-o]"); if (!b) return;
    var i = parseInt(b.closest("[data-q]").getAttribute("data-q"),10), k = parseInt(b.getAttribute("data-o"),10);
    S.quiz[i] = k; save(); paint(); beep(k===QUIZ[i].a ? "win" : "");
  });
  paint();
})();

/* ===================== result ===================== */
function ans(k){ return esc(S.t[k] || "") || none("아직 쓰지 않았어요"); }
ENTER.result = function(){
  var g = game();
  var built = g ? g.used.map(function(u){ return u.e+" "+u.n+(u.k>1?" ×"+u.k:""); }).join(", ") : "";
  document.getElementById("sheet").innerHTML =
    '<div class="sheet-h"><h2>살기 좋은 도시 설계 기록</h2><span class="hint">사회 4-2 · 3단원 13차시</span></div>'+
    '<div class="qa"><h4>가장 해결하고 싶은 도시 문제</h4><div class="ans">'+(esc(S.prob) || none("아직 고르지 않았어요"))+'\n까닭: '+ans("recall")+'</div></div>'+
    '<div class="qa"><h4>그림에서 찾은 살기 좋은 곳 ('+S.mot.length+' / '+MOT_FIND.length+')</h4><div class="ans">'+(S.mot.map(Number).sort(function(a,b){ return a-b; }).map(function(i){ return MOT_FIND[i]; }).join(", ") || none("아직 고르지 않았어요"))+'</div></div>'+
    '<div class="qa"><h4>내가 생각하는 살기 좋은 도시의 조건 (댓글)</h4><div class="ans">'+(S.posted ? ans("cmt") : none("아직 전송하지 않았어요"))+'</div></div>'+
    (g ? '<div class="qa"><h4>3D로 설계한 도시 · '+esc(g.em+" "+g.t)+' 미션 '+(g.done ? '성공 '+starTxt(g.stars) : '(설계 중)')+' · 예산 '+g.spent+' / '+g.budget+'</h4>'+
        (g.thumb ? '<img class="gshot" src="'+g.thumb+'" alt="내가 3D로 설계한 도시" style="max-width:520px;margin-bottom:10px">' : '')+
        '<div class="ans">'+(esc(built) || none("시설을 짓지 않았어요"))+'\n'+IND.map(function(x,i){ return x.k+" "+g.score[i]+"점"; }).join(" · ")+(g.weighted ? '\n우리 기준: '+wLabel(g.W)+' → '+g.wscore+'점' : '')+'</div></div>'+
      '<div class="qa"><h4>가장 중요하게 생각한 것 · 포기한 시설 · 까닭</h4><div class="ans">가장 중요하게 생각한 것: '+(g.imp>=0 ? IND[g.imp].k : none("고르지 않았어요"))+
        '\n포기한 시설: '+(esc(g.gave.map(function(x){ return x.e+" "+x.n; }).join(", ")) || none("고르지 않았어요"))+'\n까닭: '+(esc(g.why) || none("쓰지 않았어요"))+'</div></div>'
      : '<div class="qa"><h4>3D로 설계한 도시</h4><div class="ans">'+none("아직 시설을 짓지 않았어요")+'</div></div>')+
    '<div class="qa"><h4>내가 살고 싶은 ‘살기 좋은 도시’</h4><div class="ans">이름: '+esc(cityName())+'\n조건: '+(esc(condText()) || none("아직 고르지 않았어요"))+'\n까닭: '+ans("why")+'</div></div>'+
    '<div class="qa"><h4>생태 도시로 만들려면</h4><div class="ans">'+ans("eco")+'</div></div>'+
    '<div class="qa"><h4>도시 선언문</h4><div class="ans">살기 좋은 도시는 '+(esc(S.t.decl||"") || "____")+'한 곳이다.</div></div>';
};
